annotations:
- id: 1
  type: note
  span: dynamos
  body: 'An anachronism of Zweig’s: the cables of the 1850s were worked by batteries and induction
    coils. Kept as written (DECISION-Z05).'
  status: claude-drafted
- id: 2
  type: quote
  span: ‘the great feat of the Century’
  quote_library_ref: morse-great-feat
  body: Zweig quotes Morse in English and follows it with his own German gloss (*die ruhmreichste
    Tat des Jahrhunderts*). In English the gloss would merely repeat the quotation, so it
    is omitted (DECISION-Z09). Zweig’s capital C is kept.
  status: claude-drafted
