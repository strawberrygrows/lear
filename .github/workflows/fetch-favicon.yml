name: Fetch favicon
# Temporary helper: downloads the blog's site icon for use as favicon.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site icon
        run: |
          ICON=$(curl -s "https://public-api.wordpress.com/rest/v1.1/sites/edwardleartrail.wordpress.com/?fields=icon" | jq -r '.icon.img // empty')
          echo "icon url: $ICON"
          if [ -z "$ICON" ]; then echo "no site icon set"; exit 1; fi
          curl -sL -o favicon.png "${ICON}?w=64"
          curl -sL -o apple-touch-icon.png "${ICON}?w=180"
          file favicon.png apple-touch-icon.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add favicon.png apple-touch-icon.png
          git commit -m "Add favicon from the blog's site icon"
          git push
