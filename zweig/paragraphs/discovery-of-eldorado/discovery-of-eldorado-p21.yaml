annotations:
- id: 1
  type: note
  span: A wave of fire
  body: '*Feuerwoge*, the same word as the ‘gigantic wave of fire’ with which Suter cleared
    the land in 1839; the echo is deliberate and the same English is used.'
  status: claude-drafted
- id: 2
  type: note
  span: His eldest son, hard pressed by the bandits, shoots himself
  body: Here, as throughout the last two sections, Zweig follows Cendrars’s novel rather than
    the historical record (Sutter’s wife and sons did not die as described). The translation
    renders Zweig and does not correct him; the departures are a matter for an introduction,
    not for the text.
  status: claude-drafted
