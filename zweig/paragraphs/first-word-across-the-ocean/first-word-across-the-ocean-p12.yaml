annotations:
- id: 1
  type: query
  span: ‘O Eternal God,’ he begins
  body: 'No English original of this prayer has been traced. It was spoken in English at Valentia
    in August 1857 and should survive in contemporary reports (e.g. *The Times*, or Field’s
    own history of the cable). Until it is found, Zweig’s German is translated fresh in the
    language of the Authorised Version, whose phrases it echoes: Job 9:8 (‘which alone spreadeth
    out the heavens’), Psalm 89:9 (‘thou rulest the raging of the sea’), Matthew 8:27 (‘even
    the winds and the sea obey him’). Please check.'
