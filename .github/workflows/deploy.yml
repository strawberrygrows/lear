name: Publish to GitHub Pages

# Pages serves the gh-pages branch; this keeps it in sync with the
# development branch so every push republishes the site.
on:
  push:
    branches: [claude/website-migration-claude-code-qwq2ka, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
