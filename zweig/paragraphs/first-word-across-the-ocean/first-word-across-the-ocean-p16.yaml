id: first-word-across-the-ocean-p16
locus: Das Erste Wort über den Ozean, paragraph 16
section:
  de: Mißgeschick
  en: Mischance
source_url: https://projekt-gutenberg.org/authors/stefan-zweig/books/sternstunden-der-menschheit/chapter/11/
