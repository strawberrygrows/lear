name: Dump post metadata
# Temporary helper: prints title/URL/date for specific blog posts so they
# can be added to the site. Safe to delete.
on: workflow_dispatch

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and filter
        run: |
          for p in 1 2; do
            curl -s "https://public-api.wordpress.com/rest/v1.1/sites/edwardleartrail.wordpress.com/posts/?number=100&page=$p&fields=URL,title,date,excerpt" >> posts.jsonl
            echo >> posts.jsonl
          done
          jq -s '[.[].posts[]] | map(select(.URL | test("brush-up-your-lear|another-birthday-treat|outstanding-new-edward-lear-tribute|25-best-edward-lear-limericks|the-bream-and-the-mule|runcible-spoon|said-well|person-in-pink|man-with-a-beard"))) | .[] | {title, URL, date, excerpt}' posts.jsonl
